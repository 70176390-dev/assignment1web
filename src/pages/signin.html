<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IronFit Gym | Sign In</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-950 text-white">


    <!-- NAVBAR -->

    <nav class="bg-gray-900 border-b border-gray-800 sticky top-0 z-50">

        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between">

            <a href="../../index.html"
                class="text-2xl font-bold text-red-500">

                IronFit<span class="text-white">Gym</span>

            </a>


            <div class="flex flex-wrap gap-5 items-center">

                <a href="../../index.html">
                    Home
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="contact.html">
                    Contact
                </a>

                <a href="signup.html"
                    class="border border-red-500 px-4 py-2 rounded-lg">
                    Sign Up
                </a>

                <a href="signin.html"
                    class="bg-red-600 px-4 py-2 rounded-lg">
                    Sign In
                </a>

            </div>

        </div>

    </nav>


    <main class="max-w-md mx-auto px-6 py-20">


        <div class="text-center mb-8">

            <div class="text-6xl">
                🔐
            </div>

            <h1 class="text-4xl font-black mt-4">
                Welcome Back
            </h1>

            <p class="text-gray-400 mt-2">
                Sign in to your IronFit account.
            </p>

        </div>


        <div class="bg-gray-900 p-8 rounded-3xl border border-gray-800">


            <form onsubmit="return loginDemo()">


                <!-- EMAIL -->

                <div class="mb-5">

                    <label class="block mb-2">
                        Email
                    </label>

                    <input id="loginEmail"
                        type="email"
                        required
                        class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700"
                        placeholder="name@example.com">

                </div>


                <!-- PASSWORD -->

                <div class="mb-5">

                    <label class="block mb-2">
                        Password
                    </label>

                    <input id="loginPassword"
                        type="password"
                        minlength="8"
                        required
                        class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700"
                        placeholder="••••••••">

                </div>


                <!-- CHECKBOX -->

                <div class="flex items-center justify-between mb-5">

                    <label class="flex items-center gap-2 text-sm text-gray-400">

                        <input type="checkbox">

                        Remember me

                    </label>


                    <a href="#"
                        class="text-red-400 text-sm hover:underline">

                        Forgot password?

                    </a>

                </div>


                <!-- BUTTON -->

                <button type="submit"
                    class="w-full bg-red-600 hover:bg-red-700 py-3 rounded-lg font-bold">

                    Sign In

                </button>


                <p id="loginMessage"
                    class="text-sm text-center mt-4">
                </p>

            </form>


            <!-- DIVIDER -->

            <div class="flex items-center my-7">

                <div class="flex-1 h-px bg-gray-700"></div>

                <span class="px-3 text-gray-500">
                    OR
                </span>

                <div class="flex-1 h-px bg-gray-700"></div>

            </div>


            <!-- SOCIAL BUTTONS -->

            <div class="grid grid-cols-2 gap-3">

                <button type="button"
                    class="border border-gray-700 py-3 rounded-lg hover:bg-gray-800">

                    Google

                </button>


                <button type="button"
                    class="border border-gray-700 py-3 rounded-lg hover:bg-gray-800">

                    Facebook

                </button>

            </div>

        </div>


        <!-- SIGN UP -->

        <div class="mt-6 p-5 bg-gray-900 rounded-xl border border-gray-800 text-center text-gray-400">

            Don't have an account?

            <a href="signup.html"
                class="text-red-400 font-bold hover:underline">

                Sign up.

            </a>

        </div>


        <!-- SECURITY -->

        <div class="mt-5 p-4 rounded-lg bg-green-900/30 border border-green-800 text-green-300 text-sm">

            Your account information should be kept private and secure.

        </div>

    </main>


    <!-- FOOTER -->

    <footer class="bg-black border-t border-gray-800">

        <div class="text-center py-6 text-gray-500">

            © 2026 IronFit Gym

        </div>

    </footer>


    <script>

        function loginDemo() {

            document.getElementById("loginMessage").innerText =
                "Demo sign-in submitted successfully.";

            document.getElementById("loginMessage").className =
                "text-sm text-center mt-4 text-green-400";

            return false;

        }

    </script>

</body>

</html>
